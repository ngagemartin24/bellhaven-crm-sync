[project]
name = "bellhaven-sync"
version = "0.1.0"
description = "Keeps Bellhaven Senior Living's CRM accounts in step with its website; a person approves every change."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "jinja2",
    "uvicorn",
    "python-multipart",
    "requests",
    "beautifulsoup4",
]

[project.scripts]
bellhaven-sync = "bellhaven_sync.cli:main"

[dependency-groups]
dev = ["pytest", "hypothesis", "playwright", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellhaven_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: drives a real browser against the review app"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 110
target-version = "py313"
